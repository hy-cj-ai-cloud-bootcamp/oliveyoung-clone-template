<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올리브영</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-top">
            <a href="/" class="logo"><img src="https://static.oliveyoung.co.kr/pc-static-root/image/comm/h1_logo.png?ver=2" alt="올리브영" height="28"></a>
            <div class="header-search">
                <input type="text" placeholder="상품을 검색해보세요">
            </div>
            <div class="header-icons">
                <div class="auth-buttons" id="auth-buttons">
                    <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                    <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
                </div>
                <div class="user-menu" id="user-menu" style="display:none;">
                    <span id="user-name" style="font-size:13px;color:#333;"></span>
                    <a href="/pages/cart.html" style="font-size:13px;">장바구니<span id="cart-count" class="badge">0</span></a>
                    <a href="/pages/orders.html" style="font-size:13px;">주문내역</a>
                    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 카테고리 네비게이션 -->
    <nav class="category-nav">
        <div class="category-nav-inner">
            <a href="/pages/products.html">전체</a>
            <a href="/pages/products.html?category=1">스킨케어</a>
            <a href="/pages/products.html?category=2">메이크업</a>
            <a href="/pages/products.html?category=3">헤어/바디</a>
            <a href="/pages/products.html?category=4">향수</a>
            <a href="/pages/products.html?category=5">건강식품</a>
            <a href="/pages/products.html?category=6">남성</a>
        </div>
    </nav>

    <!-- 메인 배너 -->
    <section class="main-banner">
        <h2>오늘의 추천 뷰티</h2>
        <p>AI가 추천하는 나만의 뷰티 아이템</p>
        <a href="http://localhost:8501" target="_blank" class="btn btn-primary btn-lg">AI 추천 받기</a>
    </section>

    <!-- 카테고리 -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">카테고리</h2>
        </div>
        <div class="category-grid" id="category-grid"></div>
    </section>

    <!-- 베스트 상품 -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">베스트 상품</h2>
            <a href="/pages/products.html" class="section-more">전체보기 ›</a>
        </div>
        <div class="product-grid" id="product-grid"></div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
        <p>CJ올리브영 | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
        <p style="margin-top:4px;">본 사이트는 교육 목적으로 제작된 클론 프로젝트입니다.</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            checkAuth();
            await loadCategories();
            await loadPopularProducts();
        });

        async function loadCategories() {
            try {
                const categories = await api.get('/api/categories');
                const grid = document.getElementById('category-grid');
                const icons = ['🧴', '💄', '🧖', '🌸', '💊', '👨'];
                grid.innerHTML = categories.map((cat, i) => `
                    <a href="/pages/products.html?category=${cat.id}" class="category-card">
                        <span class="category-icon">${icons[i] || '✨'}</span>
                        <span class="category-name">${cat.name}</span>
                    </a>
                `).join('');
            } catch (e) { console.error('카테고리 로드 실패:', e); }
        }

        async function loadPopularProducts() {
            try {
                const data = await api.get('/api/products?limit=8');
                const products = data.products || data;
                const grid = document.getElementById('product-grid');
                grid.innerHTML = products.slice(0, 8).map(p => `
                    <div class="product-card" onclick="location.href='/pages/product-detail.html?id=${p.id}'">
                        <div class="product-image">
                            <img src="${p.image_url || ''}" alt="${p.name}" onerror="this.parentElement.style.background='#f0f0f0'">
                        </div>
                        <div class="product-info">
                            <p class="product-brand">${p.brand || ''}</p>
                            <p class="product-name">${p.name}</p>
                            <p class="product-price">${Number(p.price).toLocaleString()}원</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error('상품 로드 실패:', e); }
        }
    </script>
</body>
</html>

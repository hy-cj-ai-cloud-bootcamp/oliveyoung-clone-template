<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 내역 - 올리브영</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="/" class="logo"><img src="https://static.oliveyoung.co.kr/pc-static-root/image/comm/h1_logo.png?ver=2" alt="올리브영" height="28"></a>
            <div class="header-search">
                <input type="text" placeholder="상품을 검색해보세요">
            </div>
            <div class="header-icons">
                <div class="auth-buttons" id="auth-buttons">
                    <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                    <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
                </div>
                <div class="user-menu" id="user-menu" style="display:none;">
                    <span id="user-name" style="font-size:13px;color:#333;"></span>
                    <a href="/pages/cart.html" style="font-size:13px;">장바구니<span id="cart-count" class="badge">0</span></a>
                    <a href="/pages/orders.html" style="font-size:13px;">주문내역</a>
                    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
                </div>
            </div>
        </div>
    </header>
    <nav class="category-nav">
        <div class="category-nav-inner">
            <a href="/pages/products.html">전체</a>
            <a href="/pages/products.html?category=1">스킨케어</a>
            <a href="/pages/products.html?category=2">메이크업</a>
            <a href="/pages/products.html?category=3">헤어/바디</a>
            <a href="/pages/products.html?category=4">향수</a>
            <a href="/pages/products.html?category=5">건강식품</a>
            <a href="/pages/products.html?category=6">남성</a>
        </div>
    </nav>

    <div class="orders-section">
        <h2>주문 내역</h2>
        <div id="orders-list">
            <!-- 주문 내역이 여기에 렌더링됩니다 -->
        </div>
    </div>

    <footer class="footer">
        <p>CJ올리브영 | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            if (requireAuth()) {
                loadOrders();
            }
        });

        async function loadOrders() {
            try {
                const orders = await api.get('/api/orders');
                renderOrders(orders);
            } catch (e) {
                document.getElementById('orders-list').innerHTML = '<p style="color:#999;text-align:center;padding:40px;">주문 내역을 불러올 수 없습니다.</p>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-list');

            if (orders.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;padding:40px;">주문 내역이 없습니다.</p>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span>주문번호: #${order.id}</span>
                        <span>${order.created_at ? new Date(order.created_at).toLocaleDateString('ko-KR') : ''}</span>
                        <span class="order-status">${order.status || '주문완료'}</span>
                    </div>
                    <div class="order-items">
                        ${(order.items || []).map(item => `
                            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f8f8f8;">
                                <span style="font-size:14px;">${item.product_name || item.name}</span>
                                <span style="font-size:13px;color:#666;">${item.quantity}개 · ${formatPrice(item.price || item.product_price)}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div style="text-align:right;margin-top:12px;font-weight:700;">
                        합계: ${formatPrice(order.total_amount)}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 - 올리브영</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="/" class="logo"><img src="https://static.oliveyoung.co.kr/pc-static-root/image/comm/h1_logo.png?ver=2" alt="올리브영" height="28"></a>
            <div class="header-search">
                <input type="text" placeholder="상품을 검색해보세요">
            </div>
            <div class="header-icons">
                <div class="auth-buttons" id="auth-buttons">
                    <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                    <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
                </div>
                <div class="user-menu" id="user-menu" style="display:none;">
                    <span id="user-name" style="font-size:13px;color:#333;"></span>
                    <a href="/pages/cart.html" style="font-size:13px;">장바구니<span id="cart-count" class="badge">0</span></a>
                    <a href="/pages/orders.html" style="font-size:13px;">주문내역</a>
                    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
                </div>
            </div>
        </div>
    </header>
    <nav class="category-nav">
        <div class="category-nav-inner">
            <a href="/pages/products.html">전체</a>
            <a href="/pages/products.html?category=1">스킨케어</a>
            <a href="/pages/products.html?category=2">메이크업</a>
            <a href="/pages/products.html?category=3">헤어/바디</a>
            <a href="/pages/products.html?category=4">향수</a>
            <a href="/pages/products.html?category=5">건강식품</a>
            <a href="/pages/products.html?category=6">남성</a>
        </div>
    </nav>

    <div class="product-detail" id="product-detail">
        <!-- 상품 상세 정보가 여기에 렌더링됩니다 -->
    </div>

    <footer class="footer">
        <p>CJ올리브영 | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        let quantity = 1;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadProductDetail();
        });

        async function loadProductDetail() {
            const productId = getQueryParam('id');
            if (!productId) {
                document.getElementById('product-detail').innerHTML = '<p style="text-align:center;padding:40px;color:#999;">상품을 찾을 수 없습니다.</p>';
                return;
            }

            try {
                const product = await api.get(`/api/products/${productId}`);
                renderProduct(product);
                document.title = `${product.name} - 올리브영`;
            } catch (e) {
                document.getElementById('product-detail').innerHTML = '<p style="text-align:center;padding:40px;color:#999;">상품 정보를 불러올 수 없습니다.</p>';
            }
        }

        function renderProduct(product) {
            const container = document.getElementById('product-detail');
            container.innerHTML = `
                <div class="product-detail-image">
                    <img src="${product.image_url || ''}" alt="${product.name}" onerror="this.style.display='none'">
                </div>
                <div class="product-detail-info">
                    <p class="brand">${product.brand || ''}</p>
                    <h1>${product.name}</h1>
                    <p class="price">${formatPrice(product.price)}</p>
                    <p class="description">${product.description || ''}</p>
                    <div class="quantity-control">
                        <button onclick="changeQuantity(-1)">−</button>
                        <span id="quantity">1</span>
                        <button onclick="changeQuantity(1)">+</button>
                    </div>
                    <button class="btn btn-primary btn-lg" onclick="handleAddToCart(${product.id})" style="width:100%;">장바구니 담기</button>
                </div>
            `;
        }

        function changeQuantity(delta) {
            quantity = Math.max(1, quantity + delta);
            document.getElementById('quantity').textContent = quantity;
        }

        function handleAddToCart(productId) {
            addToCart(productId, quantity);
        }
    </script>
</body>
</html>

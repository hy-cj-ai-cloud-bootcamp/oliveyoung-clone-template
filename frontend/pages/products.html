<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록 - 올리브영</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="/" class="logo"><img src="https://static.oliveyoung.co.kr/pc-static-root/image/comm/h1_logo.png?ver=2" alt="올리브영" height="28"></a>
            <div class="header-search">
                <input type="text" placeholder="상품을 검색해보세요">
            </div>
            <div class="header-icons">
                <div class="auth-buttons" id="auth-buttons">
                    <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                    <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
                </div>
                <div class="user-menu" id="user-menu" style="display:none;">
                    <span id="user-name" style="font-size:13px;color:#333;"></span>
                    <a href="/pages/cart.html" style="font-size:13px;">장바구니<span id="cart-count" class="badge">0</span></a>
                    <a href="/pages/orders.html" style="font-size:13px;">주문내역</a>
                    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
                </div>
            </div>
        </div>
    </header>
    <nav class="category-nav">
        <div class="category-nav-inner">
            <a href="/pages/products.html">전체</a>
            <a href="/pages/products.html?category=1">스킨케어</a>
            <a href="/pages/products.html?category=2">메이크업</a>
            <a href="/pages/products.html?category=3">헤어/바디</a>
            <a href="/pages/products.html?category=4">향수</a>
            <a href="/pages/products.html?category=5">건강식품</a>
            <a href="/pages/products.html?category=6">남성</a>
        </div>
    </nav>

    <div class="section">
        <div class="section-header">
            <h2 class="section-title" id="page-title">전체 상품</h2>
            <span class="section-more" id="product-count"></span>
        </div>

        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-category="" onclick="filterByCategory('', this)">전체</button>
        </div>

        <div class="product-grid" id="product-grid">
            <!-- 상품 카드가 여기에 렌더링됩니다 -->
        </div>
    </div>

    <footer class="footer">
        <p>CJ올리브영 | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadCategories();
            loadProducts();
        });

        async function loadCategories() {
            try {
                const categories = await api.get('/api/categories');
                const filterBar = document.getElementById('filter-bar');
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.category = cat.id;
                    btn.textContent = cat.name;
                    btn.onclick = () => filterByCategory(cat.id, btn);
                    filterBar.appendChild(btn);
                });

                // URL 파라미터로 카테고리가 지정된 경우 활성화
                const categoryId = getQueryParam('category');
                if (categoryId) {
                    const btns = filterBar.querySelectorAll('.filter-btn');
                    btns.forEach(b => b.classList.remove('active'));
                    const target = filterBar.querySelector(`[data-category="${categoryId}"]`);
                    if (target) target.classList.add('active');
                }
            } catch (e) {
                console.error('카테고리 로드 실패:', e);
            }
        }

        async function loadProducts() {
            const categoryId = getQueryParam('category');
            let url = '/api/products?limit=50';
            if (categoryId) url += `&category_id=${categoryId}`;

            try {
                const data = await api.get(url);
                const products = data.products || data;
                renderProducts(products);
            } catch (e) {
                console.error('상품 로드 실패:', e);
                document.getElementById('product-grid').innerHTML = '<p style="color:#999;text-align:center;padding:40px;">상품을 불러올 수 없습니다.</p>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            const countEl = document.getElementById('product-count');
            countEl.textContent = `총 ${products.length}개`;

            if (products.length === 0) {
                grid.innerHTML = '<p style="color:#999;text-align:center;padding:40px;">등록된 상품이 없습니다.</p>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card" onclick="location.href='/pages/product-detail.html?id=${p.id}'">
                    <div class="product-image">
                        <img src="${p.image_url || ''}" alt="${p.name}" onerror="this.style.display='none'">
                    </div>
                    <div class="product-info">
                        <div class="product-brand">${p.brand || ''}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${formatPrice(p.price)}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterByCategory(categoryId, btn) {
            // 필터 버튼 활성화
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // URL 변경 및 상품 재로드
            const url = categoryId ? `/pages/products.html?category=${categoryId}` : '/pages/products.html';
            history.pushState(null, '', url);
            loadProducts();
        }
    </script>
</body>
</html>

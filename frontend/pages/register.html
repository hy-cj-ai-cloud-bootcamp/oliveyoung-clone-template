<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 올리브영</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="/" class="logo"><img src="https://static.oliveyoung.co.kr/pc-static-root/image/comm/h1_logo.png?ver=2" alt="올리브영" height="28"></a>
            <div class="header-search">
                <input type="text" placeholder="상품을 검색해보세요">
            </div>
            <div class="header-icons">
                <div class="auth-buttons" id="auth-buttons">
                    <a href="/pages/login.html" class="btn btn-outline">로그인</a>
                    <a href="/pages/register.html" class="btn btn-primary">회원가입</a>
                </div>
                <div class="user-menu" id="user-menu" style="display:none;">
                    <span id="user-name" style="font-size:13px;color:#333;"></span>
                    <a href="/pages/cart.html" style="font-size:13px;">장바구니<span id="cart-count" class="badge">0</span></a>
                    <a href="/pages/orders.html" style="font-size:13px;">주문내역</a>
                    <button class="btn btn-outline" onclick="logout()">로그아웃</button>
                </div>
            </div>
        </div>
    </header>
    <nav class="category-nav">
        <div class="category-nav-inner">
            <a href="/pages/products.html">전체</a>
            <a href="/pages/products.html?category=1">스킨케어</a>
            <a href="/pages/products.html?category=2">메이크업</a>
            <a href="/pages/products.html?category=3">헤어/바디</a>
            <a href="/pages/products.html?category=4">향수</a>
            <a href="/pages/products.html?category=5">건강식품</a>
            <a href="/pages/products.html?category=6">남성</a>
        </div>
    </nav>

    <div class="form-container">
        <h2>회원가입</h2>
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">이름</label>
                <input type="text" id="username" placeholder="이름을 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="이메일을 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요 (6자 이상)" required minlength="6">
            </div>
            <div class="form-group">
                <label for="password-confirm">비밀번호 확인</label>
                <input type="password" id="password-confirm" placeholder="비밀번호를 다시 입력하세요" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:12px;">회원가입</button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:13px;color:#999;">
            이미 계정이 있으신가요? <a href="/pages/login.html" style="color:#9bce26;font-weight:500;">로그인</a>
        </p>
    </div>

    <footer class="footer">
        <p>CJ올리브영 | CJ AI 클라우드 엔지니어 부트캠프 실습 프로젝트</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            try {
                await api.post('/api/auth/register', { username, email, password });
                alert('회원가입이 완료되었습니다! 로그인해주세요.');
                window.location.href = '/pages/login.html';
            } catch (e) {
                alert(e.detail || '회원가입에 실패했습니다. 다시 시도해주세요.');
            }
        }
    </script>
</body>
</html>
